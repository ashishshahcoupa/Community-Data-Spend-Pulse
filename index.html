<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Community Data Spend Pulse</title>
<meta name="description" content="Responsive HTML prototype of Spend Pulse's community-benchmark signal, including its full Navi sourcing-event interaction flow.">
<!-- Fonts are vendored locally (Nunito Sans, Open Sans, Material Symbols) so the
     prototype renders identically offline. -->
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="navi/navi-template.css">
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="topbar__row">
      <!-- The Coupa lockup as supplied: a single 132x36 SVG carrying both the
           flower mark and the wordmark, so there is no live text beside it to
           keep in step. One header serves all 23 screens. -->
      <a class="logo" href="#/landing" aria-label="Coupa home">
        <img class="logo__mark" src="assets/coupa-logo.svg" alt="Coupa"
          width="132" height="36">
      </a>
      <label class="usearch">
        <span class="mi mi--sm" aria-hidden="true">search</span>
        <input type="search" placeholder="What do you need?" aria-label="What do you need?">
      </label>
      <div class="top-actions">
        <button class="circle-btn" aria-label="Notifications"><span class="mi mi--sm">notifications</span></button>
        <button class="circle-btn" aria-label="Cart"><span class="mi mi--sm">shopping_cart</span></button>
        <button class="circle-btn" aria-label="Help"><span class="mi mi--sm">help</span></button>
        <div class="avatar" title="Jason Wills">JW</div>
      </div>
    </div>
  </header>

  <nav class="nav" aria-label="Primary">
    <div class="nav__row" id="nav-row"></div>
  </nav>

  <!-- Secondary navigation. A screen that has one (Sourcing does) fills this
       slot: the band runs the full width of the window, so it sits outside
       `.page`, whose padding and 1600px cap would inset it. -->
  <div id="subnav"></div>

  <main class="page" id="screen" tabindex="-1"></main>
</div>

<div id="overlay-layer" aria-live="polite"></div>
<!-- The Navi chat sits above the overlays it is handed off from and below the
     tooltips and toasts, which have to stay reachable over everything. -->
<div id="navi-layer" aria-live="polite"></div>
<div id="tip-layer"></div>
<div id="toast-layer"></div>

<!-- Navi chat on the Spend Pulse landing page: the Navi Prototype Template's
     panel and engine (coupa/Navi-Prototype-Template, branch Navi-Template),
     wrapped in `.navi-tpl` so its styles stay scoped (see navi/README.md).
     The landing page's own Navi button opens it; the template's launcher is
     kept for the engine to bind to but hidden. The script below is
     navi/spend-pulse.yaml as JSON — regenerate it from that file. -->
<div class="navi-tpl" id="navi-tpl">
<div id="navi-artifact-viewer" class="navi-artifact-viewer" aria-hidden="true">
  <div id="navi-artifact-rail" class="navi-artifact-rail"></div>
  <div id="navi-artifact-main" class="navi-artifact-main"></div>
</div>
<button id="navi-launcher" class="navi-launcher" aria-label="Open Navi" aria-expanded="false">
  <span class="navi-launcher-icon-wrap">
    <img class="navi-launcher-icon" src="assets/navi/navi-launcher-sparkle.svg" alt="" aria-hidden="true" width="24" height="24" />
  </span>
  <span class="navi-launcher-label">Navi</span>
</button>
<div id="navi-panel" class="navi-panel" data-state="welcome" aria-hidden="true">
  <header class="navi-panel-header" data-chrome="active">
    <span class="navi-panel-title">
      Navi
      <img class="navi-panel-logo-icon" src="assets/navi/navi-logo-icon.svg" alt="" aria-hidden="true" width="20" height="20" />
    </span>
    <button id="navi-close" class="navi-close" aria-label="Close Navi">−</button>
  </header>
  <div class="navi-welcome-topbar" data-chrome="welcome">
    <button id="navi-minimize" class="navi-minimize" aria-label="Close Navi">−</button>
  </div>
  <div class="navi-welcome-message" data-chrome="welcome">
    <p class="navi-welcome-tagline">Coupa's AI to help ease your workflow</p>
    <img class="navi-welcome-icon" src="assets/navi/navi-welcome-icon.svg" alt="" width="64" height="64" />
    <p class="navi-welcome-eyebrow">Welcome To</p>
    <p class="navi-welcome-title">Coupa Navi<sup class="navi-welcome-tm">TM</sup></p>
    <p class="navi-welcome-subtitle">Smarter spend powered by AI Agents</p>
  </div>
  <div class="navi-panel-toolbar" aria-hidden="true">
    <img class="navi-panel-menu-icon" src="assets/navi/navi-menu-icon.svg" alt="" width="24" height="24" />
    <span class="navi-panel-agent-select">
      <span class="navi-panel-agent-select-avatar"></span>
      <span class="navi-panel-agent-select-label">Explore agents</span>
      <img class="navi-panel-agent-select-chevron" src="assets/navi/navi-chevron-down-icon.svg" alt="" width="16" height="16" />
    </span>
    <img class="navi-panel-edit-icon" src="assets/navi/navi-edit-icon.svg" alt="" width="24" height="24" />
  </div>
  <div class="navi-panel-body">
    <p class="navi-disclaimer" data-chrome="welcome">Coupa Navi can make mistakes, please check important information.</p>
    <p class="navi-greeting" data-chrome="welcome">Hello! How can I help you today?</p>
    <div id="navi-transcript" class="navi-transcript" role="log" aria-live="polite"></div>
    <div id="navi-chips" class="navi-chips" role="group" aria-label="Suggested actions"></div>
  </div>
  <div class="navi-input-bar">
    <div class="navi-input-shell">
      <input id="navi-input-field" class="navi-input-field" type="text" placeholder="How can I assist you today?" aria-label="Message Navi" />
      <button id="navi-input-send" class="navi-input-send" aria-label="Send">
        <img class="navi-input-send-icon" src="assets/navi/navi-send-icon.svg" alt="" width="24" height="24" />
      </button>
    </div>
  </div>
  <input id="navi-file-input" type="file" multiple hidden style="display: none" aria-hidden="true" />
  <div id="navi-drop-overlay" class="navi-drop-overlay" aria-hidden="true">
    <div class="navi-drop-overlay-zone">
      <img class="navi-drop-overlay-icon" src="assets/navi/navi-dropzone-upload-icon.svg" alt="" width="56" height="56" />
      <p class="navi-drop-overlay-text">Maximum file size is 25MB.</p>
    </div>
  </div>
</div>
</div>
